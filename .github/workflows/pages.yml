name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/ai-workshop/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id (cache busting)
        run: |
          BUILD="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$BUILD/g" site/ai-workshop/index.html site/ai-workshop/app.js site/ai-workshop/version.json
          grep -q "$BUILD" site/ai-workshop/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/ai-workshop
      - id: deployment
        uses: actions/deploy-pages@v4
